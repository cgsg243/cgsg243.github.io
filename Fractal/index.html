<!DOCTYPE html>
<html>
<head>
    <style>
        body 
        {
            margin: 0;
            padding: 10px;
            background: #000;
            color: white;
        }
        canvas
        {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas" width="800" height="800"></canvas>
    <br>
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">-</button>
    <button onclick="resetView()">Reset</button>
    <p id="coord-status">Center: -0.75, 0.00 | Zoom: 1.50x</p>
    <script>
        let canvas = document.getElementById("webgl-canvas");
        let gl;
        let startTime;
        let zoom = 1.5;
        let lastX = 0;
        let lastY = 0;
        let dragging = false;
        let centerX = -0.75;
        let centerY = 0.0;
        let u_time_location;
        let u_centerLoc;
        let u_zoomLoc;
        let u_resolutionLoc;
        
        function initGL(canvas)
        {
            gl = canvas.getContext("webgl2");
            gl.viewport(0, 0, canvas.width, canvas.height);
            return true;
        }
                                 
        const shaderFs = `#version 300 es
        precision highp float;
        uniform float u_time;
        uniform float u_zoom;
        uniform vec2 u_center;
        uniform vec2 u_resolution;

        layout (location = 0) out vec4 Outcolor;

        void main()
        {
            vec2 uv = gl_FragCoord.xy / u_resolution.xy;
            float aspect = u_resolution.x / u_resolution.y;
            
            float worldX = (uv.x - 0.5) * 3.5 * aspect / u_zoom;
            float worldY = (uv.y - 0.5) * 3.5 / u_zoom;
            
            vec2 c = vec2(u_center.x + worldX, u_center.y + worldY);
            vec2 z = vec2(0.0, 0.0);
            
            int iterations = 0;
            for (int i = 0; i < 700; i++)
            {
                if (z.x * z.x + z.y * z.y > 7.0)
                   break;
                float xtemp = z.x * z.x - z.y * z.y + c.x;
                z.y = 2.0 * z.x * z.y + c.y;
                z.x = xtemp;
                iterations++;
            }
            
            float t = float(iterations) / 256.0;
            vec3 color = vec3(t * t * t * t, t * t * t, t);
            Outcolor = vec4(color, 1.0);
        }`;

        const shaderVs = `#version 300 es
        precision highp float;
        layout (location = 0) in vec2 a_pos;
        void main()
        {
            gl_Position = vec4(a_pos, 0.0, 1.0);
        }`;

        function getShader(shaderStr, type)
        {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, shaderStr);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            {
                console.error("ERROR COMPILE:", gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        let program;
        function initShaders()
        {
            let vs = getShader(shaderVs, gl.VERTEX_SHADER);
            let fs = getShader(shaderFs, gl.FRAGMENT_SHADER);
            
            if (!vs || !fs)
              return null;
                
            program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS))
            {
                console.error("LINK ERROR:", gl.getProgramInfoLog(program));
                return null;
            }
            
            u_time_location = gl.getUniformLocation(program, "u_time");
            u_centerLoc = gl.getUniformLocation(program, "u_center");
            u_zoomLoc = gl.getUniformLocation(program, "u_zoom");
            u_resolutionLoc = gl.getUniformLocation(program, "u_resolution");
            
            gl.useProgram(program);
            return program;
        }

        let vertexBuffer;
        function initBuffer()
        {
            vertexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
            let vertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        }
        
        function drawScene()
        {
            if (!gl || !program)
              return;
            
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
            gl.enableVertexAttribArray(0);  
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
            
            let timeFromStart = (Date.now() - startTime) / 1000.0;
            gl.uniform1f(u_time_location, timeFromStart);
            gl.uniform1f(u_zoomLoc, zoom);
            gl.uniform2f(u_centerLoc, centerX, centerY);
            gl.uniform2f(u_resolutionLoc, canvas.width, canvas.height);
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            
            document.getElementById("coord-status").innerHTML = 
                `Center: ${centerX.toFixed(5)}, ${centerY.toFixed(5)} | Zoom: ${zoom.toFixed(4)}x`;
            
            requestAnimationFrame(drawScene);
        }

        canvas.addEventListener("mousedown", (e) => {
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY; 
            e.preventDefault();
        });

        window.addEventListener("mousemove", (e) =>
        {
            if (!dragging) return;
            
            let dx = e.clientX - lastX;
            let dy = e.clientY - lastY;
            
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            
            let aspect = canvas.width / canvas.height;
            
            centerX -= dx * scaleX * 3.5 * aspect / (canvas.width * zoom);
            centerY += dy * scaleY * 3.5 / (canvas.height * zoom);

            lastX = e.clientX;
            lastY = e.clientY;
        });
        
        window.addEventListener("mouseup", () =>
        {
            dragging = false;
        });
        
        canvas.addEventListener("wheel", (e) =>
        {
            e.preventDefault();
            
            let rect = canvas.getBoundingClientRect();
            
            let mouseCanvasX = (e.clientX - rect.left) * (canvas.width / rect.width);
            let mouseCanvasY = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            let nx = mouseCanvasX / canvas.width;
            let ny = 1.0 - (mouseCanvasY / canvas.height);
            
            let aspect = canvas.width / canvas.height;
            
            let worldX = (nx - 0.5) * 3.5 * aspect / zoom;
            let worldY = (ny - 0.5) * 3.5 / zoom;
            
            let zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            zoom *= zoomFactor;
            zoom = Math.min(90000000.0, Math.max(0.001, zoom));
            
            let newWorldX = (nx - 0.5) * 3.5 * aspect / zoom;
            let newWorldY = (ny - 0.5) * 3.5 / zoom;
            
            centerX += worldX - newWorldX;
            centerY += worldY - newWorldY;
        });
        
        function zoomIn() {
            zoom *= 1.5;
            zoom = Math.min(90000, zoom);
        }
        
        function zoomOut()
        {
            zoom /= 1.5;
            zoom = Math.max(0.001, zoom);
        }
        
        function resetView()
        {
           centerX = -0.75;
           centerY = 0.0;
           zoom = 1.5;
        }
        
        function onStart()
        {
            if (!initGL(canvas) || !initShaders())
              return;
            initBuffer();
            startTime = Date.now();
            drawScene();
        }
        
        onStart();
    </script>
</body>
</html>
